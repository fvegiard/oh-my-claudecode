name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .nvmrc
      - package.json
      - package-lock.json
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .nvmrc
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up supported Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install native build and team tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential python3 tmux

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify native SQLite
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database(':memory:');
          try {
            if (db.prepare('SELECT 1 AS ok').get().ok !== 1) {
              throw new Error('Native SQLite smoke test failed');
            }
          } finally {
            db.close();
          }
          NODE

      - name: Build runtime and MCP entrypoints
        run: npm run build
